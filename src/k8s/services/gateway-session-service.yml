apiVersion: v1
kind: Service
metadata:
  name: session-service-external
  namespace: devops-app
spec:
  selector:
    app: session-service
  ports:
  - port: 8081
    targetPort: 8081
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service-external
  namespace: devops-app
spec:
  selector:
    app: gateway-service
  ports:
  - port: 8087
    targetPort: 8087
  type: LoadBalancer