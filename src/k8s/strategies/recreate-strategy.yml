apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: devops-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
        version:
    spec:
      containers:
      - name: gateway-service
        image: newberdi/do7:gateway-service
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        env:
        - name: APP_VERSION
          value: "v2-recreate"